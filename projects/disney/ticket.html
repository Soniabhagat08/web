<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Ticket Booking</title>
   <style>
       body {
           font-family: Arial, sans-serif;
           margin: 20px;
           background-color: #f4f4f9;
       }
       .container {
           max-width: 600px;
           margin: auto;
           background: #fff;
           padding: 20px;
           border-radius: 8px;
           box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
       }
       h2 {
           text-align: center;
       }
       label {
           display: block;
           margin-top: 10px;
       }
       input, select, button {
           width: 100%;
           padding: 10px;
           margin-top: 5px;
           border-radius: 5px;
           border: 1px solid #ccc;
       }
       button {
           background-color: #007BFF;
           color: white;
           border: none;
           cursor: pointer;
       }
       button:hover {
           background-color: #0056b3;
       }
   </style>
</head>
<body>
   <div class="container">
       <h2>Book Your Tickets</h2>
       <form action="/submit-booking" method="POST">
           
           <label for="ticket-type">Ticket Type:</label>
           <select id="ticket-type" name="ticket_type" required>
               <option value="">Select Ticket Type</option>
               <option value="regular">Adult</option>
               <option value="vip">Children</option>
               <option value="student">Student</option>
           </select>
           
           <label for="ticket-quantity">Number of Tickets:</label>
           <input type="number" id="ticket-quantity" name="ticket_quantity" min="1" max="10" required>
           
           <label for="name">Full Name:</label>
           <input type="text" id="name" name="name" placeholder="Enter your full name" required>
           <label for="email">Email Address:</label>
           <input type="email" id="email" name="email" placeholder="Enter your email address" required>
           
           <button type="submit">Book Now</button>
       </form>
   </div>
</body>
</html>
